{
  "mode": "dry-run",
  "network_enabled": false,
  "external_writes_enabled": false,
  "timezone": "UTC",
  "limits": {"max_sources": 5, "max_jobs_per_source": 50, "retry_count": 2, "timeout_seconds": 15},
  "discovery": [{"kind": "fixture", "path": "tests/fixtures/jobs.json", "enabled": true}],
  "profile": {"path": "tests/fixtures/profile.json"},
  "eligibility": {
    "primary_markets": ["Exampleland"],
    "fallback_markets": ["Fallbackland"],
    "target_role_families": ["audio", "dsp", "software"],
    "minimum_seniority": "mid",
    "workplace_preferences": ["remote", "hybrid"],
    "excluded_languages": [],
    "relocation_allowed": false
  },
  "scoring": {"role_family": 40, "specialist_audio": 25, "primary_market": 20, "workplace": 15, "threshold": 55},
  "storage": {"root": "runtime", "opportunities": "opportunities.jsonl", "seen": "seen.json"},
  "tracker": {"kind": "local", "path": "runtime/tracker.json"},
  "reporting": {"kind": "stdout"},
  "approval": {"root": "approvals", "action": "submit_application"},
  "deepseek": {"enabled": false, "model": "deepseek-chat", "endpoint": "https://api.deepseek.com/chat/completions", "api_key_env": "DEEPSEEK_API_KEY"},
  "manual_only_portals": ["captcha", "verification-required", "manual-only"]
}
